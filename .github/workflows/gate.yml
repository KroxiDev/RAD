name: Gate

on:
  pull_request:
    branches: [beta, main]
  push:
    branches: [beta, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.99.0"
  CACHE_PATHS: |
    target/cargo-home/registry/index
    target/cargo-home/registry/cache
    target/cargo-home/registry/src
    target/release
    target/plugins/release

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Paquetes del sistema
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed git rustup bubblewrap dbus libpulse glib2 python python-pygments python-yaml shfmt wayland libxkbcommon
          sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 ||
            echo "::warning::No se pudo habilitar user namespaces; bwrap puede fallar."
          stat -c '%u %a %n' / "$(dirname "$GITHUB_WORKSPACE")" "$GITHUB_WORKSPACE"
          useradd --create-home --uid "$(stat -c %u "$(dirname "$GITHUB_WORKSPACE")")" ci

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Restaurar toolchain
        id: toolchain-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/rustup-home
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}

      - name: Restaurar caché
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_PATHS }}
          key: gate-v2-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'plugins/Cargo.lock', 'scripts/conformance/metrics/fixture/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            gate-v2-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock', 'plugins/Cargo.lock', 'scripts/conformance/metrics/fixture/Cargo.lock') }}-
            gate-v2-${{ env.RUST_TOOLCHAIN }}-

      - name: Preparar Rust y dependencias
        run: |
          chown -R ci: "$GITHUB_WORKSPACE"
          runuser -u ci -- env HOME=/home/ci bash -euo pipefail -c '
            export RUSTUP_HOME="$PWD/target/rustup-home"
            rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
            rustup default "$RUST_TOOLCHAIN"
            export CARGO_HOME="$PWD/target/cargo-home"
            cargo fetch --locked
            cargo fetch --locked --manifest-path plugins/Cargo.toml
            cargo fetch --locked --manifest-path scripts/conformance/metrics/fixture/Cargo.toml
          '

      - name: Restaurar fechas de fuentes idénticas
        run: |
          runuser -u ci -- python3 -B scripts/cache_mtimes.py restore

      - name: Gate
        env:
          RAD_COMMENT_BASE: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'HEAD^' }}
        run: |
          runuser -u ci -- env RAD_COMMENT_BASE="$RAD_COMMENT_BASE" HOME=/home/ci RUSTUP_HOME="$GITHUB_WORKSPACE/target/rustup-home" \
            bash scripts/gate.sh

      - name: Registrar fechas de fuentes compiladas
        run: |
          runuser -u ci -- python3 -B scripts/cache_mtimes.py record

      - name: Guardar toolchain
        if: always() && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/rustup-home
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      - name: Guardar caché
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CACHE_PATHS }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Logs del gate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-logs
          path: target/gate/
          retention-days: 14
